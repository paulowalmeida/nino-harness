version: 1
id: feature-delivery
trigger: manual
owner: product-owner

approvalPoints:
  - contract
  - ownership-or-architecture
  - feedback-promotion
  - business-acceptance
  - production-action

stages:
  - id: product-intake
    agent: product-owner
    dependsOn: []
    output: business-brief

  - id: brief
    agent: tech-lead
    dependsOn: [product-intake]
    output: work-order

  - id: architecture
    agent: architecture
    dependsOn: [brief]
    output: architecture-decision
    approval: ownership-or-architecture

  - id: contract
    agent: architecture
    dependsOn: [architecture]
    output: approved-contract
    approval: contract

  - id: surface-discovery
    agent: qa
    dependsOn: [brief, contract]
    output: surface-inventory

  - id: backend
    agent: backend-dev
    dependsOn: [contract, surface-discovery]
    parallelGroup: implementation
    output: implementation-handoff

  - id: frontend
    agent: frontend-dev
    dependsOn: [contract]
    parallelGroup: implementation
    output: implementation-handoff

  - id: security
    agent: security
    dependsOn: [backend, frontend]
    output: security-review

  - id: testing
    agent: testing
    dependsOn: [backend, frontend]
    output: test-report

  - id: qa
    agent: qa
    dependsOn: [backend, frontend, surface-discovery]
    output: qa-handoff

  - id: qa-routing
    agent: tech-lead
    dependsOn: [qa]
    output: routing-decision
    loop:
      start: qa
      maxIterations: 3
      onFail: ROUTE-CORRECTION
      onCorrectionComplete: qa
      onPass: READY-FOR-BUSINESS-REGRESSION
      onExhausted: BLOCKED
    note: If QA reports a defect, route correction to frontend-dev, backend-dev or both, record the iteration evidence, and return to QA. Stop after three failed iterations and escalate as BLOCKED.

  - id: retrospective
    agent: learning-curator
    dependsOn: [security, testing, qa-routing]
    output: feedback-record

  - id: learning-review
    agent: learning-curator
    dependsOn: [retrospective]
    output: learning-decision
    approval: feedback-promotion

  - id: business-regression
    agent: product-owner
    dependsOn: [security, testing, qa-routing, learning-review]
    output: business-regression
    approval: business-acceptance

  - id: documentation
    agent: documentation
    dependsOn: [security, testing, qa-routing, learning-review, business-regression]
    output: documentation-handoff

  - id: release
    agent: release
    dependsOn: [documentation]
    output: release-report
    approval: production-action
