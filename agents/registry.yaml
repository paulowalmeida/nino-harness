version: 1

defaults:
  mode: read-only
  humanApproval:
    materialProductDecision: required
    publicContractChange: required
    ownershipOrArchitectureChange: required
    productionAction: required
  completionStatuses:
    - NEEDS-DECISION
    - READY-FOR-EXECUTION
    - IN-PROGRESS
    - REVIEW
    - BLOCKED
    - DONE
    - INCOMPLETE

agents:
  - id: product-owner
    status: active
    role: product-owner
    mission: Turn user intent into business tasks, acceptance criteria, priorities, and mandatory business regression checks.
    repositories: [nino-api, nino-app, nino-docs]
    permissions: [read, inspect, clarify, define-acceptance, create-tech-lead, review, run-checks]
    forbidden: [create-specialists, edit-source, technical-routing, change-architecture, deploy]
    creationScope: tech-lead-only
    input: user-request
    outputs: [business-brief, business-regression]
    workflow: feature-delivery

  - id: tech-lead
    status: active
    role: tech-lead
    mission: Lead technical delivery, choose specialists, and consolidate evidence without owning product decisions.
    repositories: [nino-api, nino-app, nino-docs]
    permissions: [read, inspect, plan, delegate, create-specialists, review]
    forbidden: [edit-source, change-schema, deploy, publish]
    creationScope: specialist-only
    input: feature-request
    output: work-order
    workflow: feature-delivery

  - id: sre-platform
    status: active
    role: operator
    mission: Manage environments, Vercel delivery, observability, rollback readiness, and operational risk without autonomous production changes.
    repositories: [nino-api, nino-app, nino-docs]
    permissions: [read, inspect, plan, configure, run-checks, review]
    forbidden: [mutate-production, deploy-without-approval, rotate-secrets-without-approval, skip-gates]
    input: work-order
    outputs: [environment-plan, operations-review]
    workflow: feature-delivery

  - id: architecture
    status: active
    role: specialist
    mission: Define ownership, boundaries, dependencies, and contracts.
    repositories: [nino-api, nino-app, nino-docs]
    permissions: [read, inspect, propose, review]
    forbidden: [implement-without-approval, deploy]
    output: architecture-decision

  - id: backend-dev
    status: active
    role: implementer
    mission: Implement changes in nino-api while respecting its rules and gates.
    repositories: [nino-api]
    permissions: [read, inspect, edit-source, edit-tests, run-checks]
    forbidden: [change-product-scope, change-contract-without-approval, change-schema-without-approval, commit-without-request, deploy]
    requiredAdapter: nino-api
    output: implementation-handoff

  - id: frontend-dev
    status: active
    role: implementer
    mission: Implement changes in nino-app while respecting its Pages architecture.
    repositories: [nino-app]
    permissions: [read, inspect, edit-source, edit-tests, run-checks]
    forbidden: [change-api-contract-without-approval, change-product-scope, commit-without-request, deploy]
    requiredAdapter: nino-app
    output: implementation-handoff

  - id: learning-curator
    status: active
    role: reviewer
    mission: Classify feedback and promote reusable learning with evidence and explicit approval.
    repositories: [nino-api, nino-app, nino-docs, nino-harness]
    permissions: [read, inspect, propose, review]
    forbidden: [auto-promote, change-product-scope, change-contract-without-approval, deploy]
    output: learning-decision

  - id: security
    status: active
    role: reviewer
    mission: Audit authorization, ownership, data exposure, and abuse.
    repositories: [nino-api, nino-app]
    permissions: [read, inspect, review, run-checks]
    forbidden: [accept-risk-without-decision, deploy]
    output: security-review

  - id: testing
    status: active
    role: reviewer
    mission: Design and execute behavioral coverage and regression protection.
    repositories: [nino-api, nino-app]
    permissions: [read, inspect, edit-tests, run-checks]
    forbidden: [weaken-tests, skip-failures]
    output: test-report

  - id: qa
    status: active
    role: verifier
    mission: Discover the product surface and validate acceptance criteria, real flows, integration and regressions with reproducible evidence.
    repositories: [nino-api, nino-app, nino-docs]
    permissions: [read, inspect, run-checks, browser-checks, review]
    forbidden: [edit-source, weaken-tests, accept-risk-without-decision, production-mutation]
    outputs: [surface-inventory, qa-handoff]

  - id: ux-ui
    status: active
    role: specialist
    mission: Define experience, interaction, accessibility, and Design System usage.
    repositories: [nino-app]
    permissions: [read, inspect, propose, review]
    forbidden: [change-api-contract, deploy]
    requiredAdapter: nino-app
    output: ux-review

  - id: documentation
    status: active
    role: implementer
    mission: Update contracts, operations, and technical documentation.
    repositories: [nino-docs, nino-api, nino-app]
    permissions: [read, inspect, edit-docs, run-checks]
    forbidden: [change-source-contract, deploy]
    output: documentation-handoff

  - id: release
    status: active
    role: verifier
    mission: Run gates and prepare delivery without publishing automatically.
    repositories: [nino-api, nino-app, nino-docs]
    permissions: [read, inspect, run-checks, review]
    forbidden: [skip-gates, deploy-without-approval]
    output: release-report
